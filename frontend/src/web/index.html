<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waddington — gene selection</title>
  <style>
    :root {
      --bg:#0f1216; --sidebar:#0a0d11; --panel:#171b21; --panel-2:#1d232b;
      --ink:#e9edf2; --muted:#8b97a6; --faint:#5b6675;
      --sage:#a7c080; --sage-dim:#7f9c5f; --sage-ink:#12331a;
      --line:#242a32; --line-soft:#1b2027; --user-bubble:#232c37;
      --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.35);
    }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button { font-family:inherit; }

    /* ---------- App shell ---------- */
    .app { display:grid; grid-template-columns:270px 1fr; height:100vh; overflow:hidden; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      background:var(--sidebar); border-right:1px solid var(--line-soft);
      display:flex; flex-direction:column; min-height:0;
    }
    .brand { display:flex; align-items:center; gap:10px; padding:16px 16px 12px; }
    .brand .logo {
      width:30px; height:30px; border-radius:9px; flex:none;
      background:linear-gradient(145deg,var(--sage),var(--sage-dim));
      display:grid; place-items:center; font-size:16px;
    }
    .brand .name { font-weight:650; font-size:15px; letter-spacing:.01em; }
    .brand .sub { font-size:11px; color:var(--faint); }
    .new-chat {
      margin:4px 12px 8px; padding:10px 12px; display:flex; align-items:center; gap:8px;
      background:var(--panel); color:var(--ink); border:1px solid var(--line);
      border-radius:10px; cursor:pointer; font-size:14px; font-weight:550; transition:background .15s,border-color .15s;
    }
    .new-chat:hover { background:var(--panel-2); border-color:#2f3742; }
    .new-chat .plus { font-size:17px; line-height:1; color:var(--sage); }
    .history-label { padding:12px 18px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); }
    .history { flex:1; overflow-y:auto; padding:0 8px 12px; }
    .history::-webkit-scrollbar, .chat-scroll::-webkit-scrollbar { width:8px; }
    .history::-webkit-scrollbar-thumb, .chat-scroll::-webkit-scrollbar-thumb { background:#222a33; border-radius:8px; }
    .chat-item {
      position:relative; display:flex; align-items:center; gap:8px;
      padding:9px 10px; margin:2px 0; border-radius:9px; cursor:pointer;
      color:var(--muted); font-size:13.5px; transition:background .12s,color .12s;
    }
    .chat-item:hover { background:var(--panel); color:var(--ink); }
    .chat-item.active { background:var(--panel-2); color:var(--ink); }
    .chat-item .ci-icon { flex:none; opacity:.7; font-size:13px; }
    .chat-item .ci-title { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chat-item .ci-del {
      flex:none; opacity:0; border:0; background:transparent; color:var(--faint);
      cursor:pointer; font-size:15px; padding:2px 4px; border-radius:6px; line-height:1;
    }
    .chat-item:hover .ci-del { opacity:1; }
    .chat-item .ci-del:hover { color:#e88; background:#2a1e1e; }
    .history-empty { padding:14px 18px; color:var(--faint); font-size:12.5px; }
    .sidebar-foot { border-top:1px solid var(--line-soft); padding:12px 16px; font-size:11.5px; color:var(--faint); }
    .sidebar-foot code { color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }

    /* ---------- Main column ---------- */
    .main { display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
    .topbar {
      display:none; align-items:center; gap:12px; padding:12px 16px;
      border-bottom:1px solid var(--line-soft); background:var(--bg);
    }
    .topbar .menu-btn { background:transparent; border:0; color:var(--ink); font-size:20px; cursor:pointer; padding:2px 6px; }
    .topbar .tb-title { font-weight:600; font-size:15px; }

    .chat-scroll { flex:1; overflow-y:auto; scroll-behavior:smooth; }
    .chat-inner { max-width:800px; margin:0 auto; padding:26px 20px 8px; }

    /* ---------- Turns ---------- */
    .turn { display:flex; gap:14px; padding:12px 0; animation:rise .25s ease; }
    @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    .avatar {
      width:30px; height:30px; border-radius:8px; flex:none; display:grid; place-items:center;
      font-size:14px; font-weight:650; margin-top:2px;
    }
    .turn.bot .avatar { background:linear-gradient(145deg,var(--sage),var(--sage-dim)); color:var(--sage-ink); }
    .turn.you .avatar { background:var(--panel-2); color:var(--muted); border:1px solid var(--line); font-size:12px; }
    .content { flex:1; min-width:0; padding-top:1px; }
    .who { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin:0 0 4px; }
    .bubble { background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius); padding:12px 15px; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere; }
    .turn.you .bubble { background:var(--user-bubble); border-color:#2a3440; }
    .bubble b { color:#f2f5f8; }

    .genes { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
    .gene {
      background:#1b2a22; color:var(--sage); border:1px solid #2b3d31; border-radius:7px;
      padding:3px 9px; font:12.5px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    .meta { color:var(--muted); font-size:12.5px; margin-top:8px; }
    .bubble pre {
      overflow-x:auto; background:#0c1015; border:1px solid var(--line-soft);
      padding:11px 13px; border-radius:10px; margin:10px 0 0;
      font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:#cdd6df;
    }
    .file-input {
      display:block; margin-top:10px; font-size:12.5px; color:var(--muted);
    }
    .file-input::file-selector-button {
      background:var(--panel-2); color:var(--ink); border:1px solid var(--line);
      border-radius:8px; padding:6px 12px; margin-right:10px; cursor:pointer; font-size:12.5px;
    }
    .file-input::file-selector-button:hover { border-color:var(--sage-dim); }

    /* typing dots */
    .dots { display:inline-flex; gap:4px; align-items:center; height:20px; }
    .dots i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite ease-in-out; }
    .dots i:nth-child(2){ animation-delay:.2s; } .dots i:nth-child(3){ animation-delay:.4s; }
    @keyframes blink { 0%,80%,100%{ opacity:.25; transform:scale(.8);} 40%{ opacity:1; transform:scale(1);} }

    /* ---------- Welcome hero ---------- */
    .hero { max-width:720px; margin:0 auto; padding:8vh 20px 20px; text-align:center; }
    .hero .mark {
      width:56px; height:56px; border-radius:16px; margin:0 auto 18px;
      background:linear-gradient(145deg,var(--sage),var(--sage-dim));
      display:grid; place-items:center; font-size:28px; box-shadow:var(--shadow);
    }
    .hero h1 { font-size:24px; font-weight:650; margin:0 0 8px; letter-spacing:.01em; }
    .hero p { color:var(--muted); font-size:14.5px; margin:0 auto 26px; max-width:520px; }
    .suggestions { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:560px; margin:0 auto; }
    .suggestion {
      text-align:left; background:var(--panel); border:1px solid var(--line);
      border-radius:12px; padding:12px 14px; cursor:pointer; color:var(--ink);
      transition:background .15s,border-color .15s,transform .1s;
    }
    .suggestion:hover { background:var(--panel-2); border-color:#303a45; transform:translateY(-1px); }
    .suggestion .s-icon { font-size:16px; }
    .suggestion .s-title { font-size:13.5px; font-weight:550; margin-top:6px; }
    .suggestion .s-desc { font-size:12px; color:var(--muted); margin-top:2px; }

    /* ---------- Composer ---------- */
    .composer-wrap { border-top:1px solid var(--line-soft); background:linear-gradient(var(--bg),var(--bg)); padding:14px 20px 10px; }
    .composer { max-width:800px; margin:0 auto; }
    .attach-chip {
      display:none; align-items:center; gap:8px; margin:0 4px 8px; padding:7px 10px;
      background:var(--panel-2); border:1px solid var(--line); border-radius:10px; font-size:12.5px; color:var(--muted); width:max-content; max-width:100%;
    }
    .attach-chip.show { display:inline-flex; }
    .attach-chip .ac-name { color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:280px; }
    .attach-chip .ac-x { border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:15px; line-height:1; padding:0 2px; }
    .attach-chip .ac-x:hover { color:#e88; }
    .input-box {
      display:flex; align-items:flex-end; gap:8px; background:var(--panel);
      border:1px solid var(--line); border-radius:20px; padding:8px 8px 8px 10px;
      box-shadow:var(--shadow); transition:border-color .15s;
    }
    .input-box:focus-within { border-color:var(--sage-dim); }
    .icon-btn {
      flex:none; width:38px; height:38px; border-radius:12px; border:0; background:transparent;
      color:var(--muted); cursor:pointer; font-size:19px; display:grid; place-items:center; transition:background .12s,color .12s;
    }
    .icon-btn:hover { background:var(--panel-2); color:var(--ink); }
    #q {
      flex:1; resize:none; border:0; outline:0; background:transparent; color:var(--ink);
      font:15px/1.5 inherit; padding:9px 4px; max-height:200px; min-height:22px;
    }
    #q::placeholder { color:var(--faint); }
    .send-btn {
      flex:none; width:38px; height:38px; border-radius:12px; border:0; cursor:pointer;
      background:var(--sage); color:var(--sage-ink); display:grid; place-items:center; transition:opacity .15s,transform .1s;
    }
    .send-btn:hover { transform:translateY(-1px); }
    .send-btn:disabled { opacity:.4; cursor:default; transform:none; }
    .send-btn svg { width:18px; height:18px; }
    .composer-hint { max-width:800px; margin:8px auto 0; text-align:center; font-size:11.5px; color:var(--faint); }

    /* ---------- Responsive ---------- */
    .scrim { display:none; }
    @media (max-width:820px) {
      .app { grid-template-columns:1fr; }
      .sidebar {
        position:fixed; z-index:30; top:0; bottom:0; left:0; width:280px;
        transform:translateX(-100%); transition:transform .2s ease;
      }
      .app.nav-open .sidebar { transform:none; }
      .app.nav-open .scrim { display:block; position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.5); }
      .topbar { display:flex; }
      .suggestions { grid-template-columns:1fr; }
    }

    /* ---------- Live retrospective-run timeline (SSE, Claude-Code-style) ---------- */
    .run-timeline { display:flex; flex-direction:column; gap:10px; }
    .run-head { background:#122019; border:1px solid #294034; border-radius:10px; padding:10px 13px; font-size:13.5px; color:var(--ink); }
    .run-head .rh-readout { color:var(--muted); font-size:12px; margin-top:4px; word-break:break-all; }
    .run-round { border:1px solid var(--line-soft); border-radius:10px; padding:11px 13px; background:var(--panel); }
    .run-round .rr-head { display:flex; align-items:center; gap:8px; font-weight:600; font-size:13.5px; }
    .run-round .rr-spin { width:9px; height:9px; border-radius:50%; border:2px solid var(--sage); border-top-color:transparent; animation:rspin .7s linear infinite; }
    @keyframes rspin { to { transform:rotate(360deg); } }
    .run-round.done .rr-spin { display:none; }
    .rr-body { margin-top:8px; font-size:12.5px; color:var(--muted); }
    .src-chips { display:flex; gap:6px; flex-wrap:wrap; margin:7px 0; }
    .src-chip { font-size:11px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--ink); }
    .src-chip.ml   { background:#0e2033; border-color:#20537f; }
    .src-chip.llm  { background:#241a33; border-color:#5a3aa7; }
    .src-chip.both { background:#0f2a1c; border-color:#1f7f52; }
    .transfer-note { margin:7px 0 2px; font-size:11.5px; color:var(--sage); background:#101d16; border:1px solid #26402f; border-radius:7px; padding:4px 9px; }
    .shap-row { display:flex; align-items:center; gap:8px; margin:3px 0; font-size:11.5px; }
    .shap-row .sh-name { width:150px; color:var(--muted); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .shap-row .sh-bar { height:8px; border-radius:5px; background:linear-gradient(90deg,var(--sage),var(--sage-dim)); }
    .reveal-line { display:flex; align-items:center; gap:10px; margin-top:9px; font-size:12.5px; color:var(--ink); }
    .reveal-line .rv-hits { color:var(--sage); font-weight:600; }
    .progress { flex:1; height:9px; border-radius:6px; background:#0c1015; border:1px solid var(--line-soft); overflow:hidden; }
    .progress > i { display:block; height:100%; background:linear-gradient(90deg,var(--sage),var(--sage-dim)); transition:width .5s ease; }
    .run-genes { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.7; }
    .run-genes .g { display:inline-block; background:var(--panel-2); border:1px solid var(--line); border-radius:5px; padding:0 5px; margin:0 3px 3px 0; color:var(--ink); }
    .run-summary { background:linear-gradient(145deg,#12241a,#0e1c15); border:1px solid #2b4d38; border-radius:12px; padding:15px 17px; }
    .run-summary .rs-num { font-size:30px; font-weight:700; color:var(--sage); letter-spacing:-.5px; }
    .run-summary .rs-sub { color:var(--muted); font-size:12.5px; margin-top:2px; }
    .run-summary table { width:100%; border-collapse:collapse; margin-top:11px; font-size:12px; }
    .run-summary td, .run-summary th { text-align:right; padding:3px 8px; border-bottom:1px solid var(--line-soft); color:var(--ink); }
    .run-summary th { color:var(--muted); font-weight:550; }
    .run-summary td:first-child, .run-summary th:first-child { text-align:left; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="scrim" id="scrim"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">🧬</div>
        <div>
          <div class="name">Waddington</div>
          <div class="sub">CRISPR gene selection</div>
        </div>
      </div>
      <button type="button" class="new-chat" id="newChat"><span class="plus">＋</span> New chat</button>
      <div class="history-label">History</div>
      <div class="history" id="history"></div>
      <div class="sidebar-foot">
        Tool-less shell over the <code>C-arm</code> pipeline.<br />Genes come from the Python selection pipeline — never from chat narration.
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="topbar">
        <button type="button" class="menu-btn" id="menuBtn" aria-label="Toggle history">☰</button>
        <div class="tb-title">Waddington</div>
      </div>

      <div class="chat-scroll" id="scroll">
        <div class="chat-inner" id="log"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <div class="attach-chip" id="attachChip">
            <span>📎</span><span class="ac-name" id="attachName"></span>
            <button type="button" class="ac-x" id="attachRemove" title="Remove attachment">✕</button>
          </div>
          <form class="input-box" id="f">
            <input type="file" id="fileInput" accept=".csv,.txt,.tsv" hidden />
            <button type="button" class="icon-btn" id="attachBtn" title="Attach a dataset / results file">📎</button>
            <textarea id="q" rows="1" autocomplete="off" placeholder="Message Waddington…  (name a phenotype, report results, or attach a screen file)" autofocus></textarea>
            <button type="submit" class="send-btn" id="send" title="Send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </form>
          <div class="composer-hint">Waddington drives a stateful CRISPR gene-selection pipeline. Report hits each round to adapt the next batch.</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    "use strict";
    const WEB_TOKEN = "__WADDINGTON_WEB_TOKEN__";
    const apiHeaders = () => ({ "content-type": "application/json", "x-waddington-token": WEB_TOKEN });
    // ---------------- DOM ----------------
    const app        = document.getElementById("app");
    const log        = document.getElementById("log");
    const scroller   = document.getElementById("scroll");
    const form       = document.getElementById("f");
    const q          = document.getElementById("q");
    const send       = document.getElementById("send");
    const historyEl  = document.getElementById("history");
    const fileInput  = document.getElementById("fileInput");
    const attachBtn  = document.getElementById("attachBtn");
    const attachChip = document.getElementById("attachChip");
    const attachName = document.getElementById("attachName");
    const attachRemove = document.getElementById("attachRemove");

    // ---------------- persistence ----------------
    const LS_KEY = "waddington.chats.v1";
    const NEW_TITLE = "New chat";
    let chats = [];        // newest first: { id, title, msgs:[], state, updatedAt }
    let current = null;    // active chat
    let appState = { dataset:null, hits:[], misses:[], campaign:null, onboarding:null };
    let staged = null;     // { name, content } pending composer attachment
    const pendingChats = new Set();

    function loadChats() {
      try { chats = JSON.parse(localStorage.getItem(LS_KEY)) || []; }
      catch { chats = []; }
      if (!Array.isArray(chats)) chats = [];
    }
    function saveChats() {
      try { localStorage.setItem(LS_KEY, JSON.stringify(chats.slice(0, 100))); } catch {}
    }
    function freshState() { return { dataset:null, hits:[], misses:[], campaign:null, onboarding:null }; }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    // ---------------- helpers ----------------
    function el(cls, html) { const d = document.createElement("div"); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }
    function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }
    function scrollDown() { requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; }); }

    function clearHero() { const h = log.querySelector(".hero"); if (h) h.remove(); }

    // avatar + content row
    function turnRow(who, node) {
      const row = el("turn " + who);
      const av = el("avatar", who === "you" ? "You" : "🧬");
      const content = el("content");
      content.appendChild(el("who", who === "you" ? "You" : "Waddington"));
      content.appendChild(node);
      row.appendChild(av); row.appendChild(content);
      return row;
    }
    function addYou(text) { clearHero(); log.appendChild(turnRow("you", el("bubble", esc(text)))); scrollDown(); }
    function addBot(node) { clearHero(); log.appendChild(turnRow("bot", node)); scrollDown(); }

    function fileInputNode() {
      const up = document.createElement("input");
      up.type = "file"; up.accept = ".csv,.txt,.tsv"; up.className = "file-input";
      up.onchange = () => uploadFile(up);
      return up;
    }

    // Gene chips are identifiers, never prose — mark them translate="no" so browser
    // page-translation (Google Translate etc.) leaves symbols intact (COPS4 must not
    // become “警察4”). Prose/narration stays translatable.
    function genesBox(list) {
      const g = el("genes"); g.setAttribute("translate", "no"); g.classList.add("notranslate");
      for (const x of list) {
        const chip = el("gene", esc(x)); chip.setAttribute("translate", "no");
        g.appendChild(chip);
      }
      return g;
    }

    // ---------------- result rendering (kinds unchanged) ----------------
    function renderResult(r) {
      if (r.kind === "suggest") {
        const b = el("bubble");
        b.appendChild(el(null, r.narration ? esc(r.narration) : ("Recommended batch for " + esc(r.dataset) + ".")));
        b.appendChild(genesBox(r.genes));
        b.appendChild(el("meta", `round ${r.info?.round ?? 1} · ${r.genes.length} genes · route ${esc(r.info?.route||"?")} · report hits to adapt`));
        addBot(b);
      } else if (r.kind === "onboard") {
        const b = el("bubble");
        const chips = genesBox;
        if (r.stage === "pool") {
          b.appendChild(el(null, `<b>Onboarding · ${esc(r.name)}</b> — ${esc(r.text)}`));
          b.appendChild(fileInputNode());
        } else if (r.stage === "done") {
          b.appendChild(el(null, `<b>Phenotype registered · ${esc(r.name)}</b> — pool ${r.n_genes} genes (${r.n_genes_with_known_features} with known features)${tierNote(r.tier, r.n_core_essential_removed)}`
            + (r.hit_rule_text ? ` · hit rule: ${esc(r.hit_rule_text)}` : "") + designNote(r.metadata, r.depmap_policy)));
          if (r.anchors?.length) b.appendChild(chips(r.anchors));
          b.appendChild(el("meta", `now rankable — try “run a real experiment on ${esc(r.name)} with my own results”`));
        } else {
          b.appendChild(el(null, esc(r.text || "…")));
        }
        addBot(b);
      } else if (r.kind === "campaign") {
        if (r.stage === "await") { addBot(el("bubble", esc(r.text))); return; }
        const b = el("bubble");
        const chips = genesBox;
        if (r.stage === "awaiting_results") {
          if (r.text) { b.appendChild(el(null, esc(r.text))); }
          else {
            b.appendChild(el(null, `<b>Round ${r.round} committed</b> · ${r.genes.length} genes tested. Upload this round's screen readout to reveal hits:`));
            b.appendChild(fileInputNode());
            b.appendChild(el("meta", "MAGeCK gene_summary or Gene,Score CSV — or type “stop” to end"));
          }
          addBot(b); return;
        }
        if (r.stage === "proposed") {
          b.appendChild(el(null, `<b>Experiment · ${esc(r.dataset)}</b> — Round ${r.round}/${r.maxRounds}. Proposed batch (${r.genes.length}):`));
          b.appendChild(chips(r.genes));
          b.appendChild(el("meta", r.mode === "upload"
            ? "type “commit” to lock in this batch (you'll upload results next), or “stop”"
            : "type “commit” to test this batch (reveal phenotype), or “stop” to end"));
        } else if (r.stage === "revealed") {
          b.appendChild(el(null, `<b>Round ${r.round} results:</b> ${r.roundHits.length} hits — <span translate="no">${esc(r.roundHits.join(", ") || "(none)")}</span>`));
          b.appendChild(el("meta", `cumulative ${progressText(r)}${r.hitRule ? ` · hits called by ${esc(r.hitRule)}` : ""}`
            + (r.overridesIgnored?.length ? ` · the registered hit rule applies (ignored: ${esc(r.overridesIgnored.join(", "))})` : "")));
          b.appendChild(el(null, `<b>Round ${r.nextRound}</b> proposed batch (${r.next.length}):`));
          b.appendChild(chips(r.next));
          b.appendChild(el("meta", "“commit” to continue, or “stop” to end"));
        } else if (r.stage === "done") {
          b.appendChild(el(null, `<b>Experiment complete · ${esc(r.dataset)}</b> — cumulative ${progressText(r)} over ${r.history.length} rounds`));
          const pre = document.createElement("pre");
          pre.textContent = r.history.map(h => `round ${h.round}: +${h.hits.length} → ${h.cumulative} (${h.ratio != null ? pct(h.ratio) : `${pct(h.hitRate)} of ${h.testedSoFar} tested`})`).join("\n");
          b.appendChild(pre);
          if (r.tracePath) b.appendChild(el("meta", "trace saved: " + esc(r.tracePath)));
        }
        addBot(b);
      } else if (r.kind === "simulate") {
        const b = el("bubble"); const pre = document.createElement("pre"); pre.setAttribute("translate", "no"); pre.textContent = r.text; b.appendChild(pre); addBot(b);
      } else {
        addBot(el("bubble", esc(r.text || "…")));
      }
    }

    // Re-render a stored message (no network, no re-record).
    function renderMsg(m) {
      if (m.role === "you") addYou(m.text);
      else if (m.result) renderResult(m.result);
      else if (m.text != null) addBot(el("bubble", esc(m.text)));
    }

    // ---------------- welcome hero ----------------
    const GREETINGS = [
      "What phenotype are we screening today?",
      "Point me at a phenotype and I'll rank the genes worth testing next.",
      "Ready when you are — name a CRISPR screen and I'll propose the genes.",
      "Which screen should we tackle? I'll handle the gene selection.",
      "New screen? Name the phenotype (or register your own) and we'll begin.",
      "Let's find some hits — which phenotype are you after?",
      "Tell me the readout and I'll pick the genes worth perturbing next.",
    ];
    const SUGGESTIONS = [
      { icon:"⚡", title:"Auto-run a completed screen", desc:"Live step-by-step → final hit@R5", run:{ dataset:"IFNG", rounds:5 } },
      { icon:"📤", title:"Upload & run my own screen", desc:"Register a new screen → hit@R5", upload:true },
      { icon:"🧫", title:"Recommend a batch", desc:"Genes for an IFNG screen", send:"Recommend genes for an IFNG screen" },
      { icon:"🔬", title:"Run an experiment", desc:"Round-by-round, adapt on results", send:"Let's run an interactive round-by-round experiment on IFNG" },
    ];
    function renderHero() {
      log.innerHTML = "";
      const hero = el("hero");
      hero.appendChild(el("mark", "🧬"));
      const h1 = document.createElement("h1"); h1.textContent = "Waddington"; hero.appendChild(h1);
      const p = document.createElement("p"); p.textContent = GREETINGS[Math.floor(Math.random() * GREETINGS.length)]; hero.appendChild(p);
      const grid = el("suggestions");
      for (const s of SUGGESTIONS) {
        const card = document.createElement("button");
        card.type = "button"; card.className = "suggestion";
        card.innerHTML = `<div class="s-icon">${s.icon}</div><div class="s-title">${esc(s.title)}</div><div class="s-desc">${esc(s.desc)}</div>`;
        card.onclick = s.run ? () => runDemo(s.run.dataset, s.run.rounds)
          : s.upload ? () => startUploadRun()
          : () => sendTurn(s.send);
        grid.appendChild(card);
      }
      hero.appendChild(grid);
      log.appendChild(hero);
    }

    // ---------------- sidebar / history ----------------
    function chatTitle(c) { return c.title && c.title !== NEW_TITLE ? c.title : NEW_TITLE; }
    function renderSidebar() {
      historyEl.innerHTML = "";
      if (!chats.length) { historyEl.appendChild(el("history-empty", "No conversations yet.")); return; }
      for (const c of chats) {
        const item = el("chat-item" + (current && c.id === current.id ? " active" : ""));
        item.appendChild(el("ci-icon", "💬"));
        const t = el("ci-title"); t.textContent = chatTitle(c); item.appendChild(t);
        const del = document.createElement("button");
        del.className = "ci-del"; del.textContent = "🗑"; del.title = "Delete conversation";
        del.onclick = (e) => { e.stopPropagation(); deleteChat(c.id); };
        item.appendChild(del);
        item.onclick = () => selectChat(c.id);
        historyEl.appendChild(item);
      }
    }

    function refreshView() {
      log.innerHTML = "";
      if (!current || !current.msgs.length) { renderHero(); return; }
      for (const m of current.msgs) renderMsg(m);
      scrollDown();
    }

    function newChat() {
      // Reuse an existing empty chat instead of piling up blanks.
      const empty = chats.find(c => !c.msgs.length);
      current = empty || { id:uid(), title:NEW_TITLE, msgs:[], state:freshState(), updatedAt:Date.now() };
      if (!empty) chats.unshift(current);
      appState = current.state || freshState();
      clearStaged(); syncComposer();
      saveChats(); renderSidebar(); refreshView();
      closeNav(); q.focus();
    }
    function selectChat(id) {
      const c = chats.find(x => x.id === id); if (!c) return;
      current = c; appState = c.state || freshState();
      clearStaged(); syncComposer();
      renderSidebar(); refreshView(); closeNav();
    }
    function deleteChat(id) {
      chats = chats.filter(c => c.id !== id);
      if (current && current.id === id) current = null;
      saveChats();
      if (!current) { if (chats.length) selectChat(chats[0].id); else newChat(); }
      else renderSidebar();
    }
    function setTitleFrom(text) {
      if (current.title && current.title !== NEW_TITLE) return;
      const t = (text || "").trim().replace(/\s+/g, " ");
      if (t) current.title = t.length > 42 ? t.slice(0, 42) + "…" : t;
    }
    function pushMsg(m, chat = current) {
      if (!chat || !chats.includes(chat)) return;
      chat.msgs.push(m);
      chat.updatedAt = Date.now();
      if (chat === current) chat.state = appState;
      // bump to top of history
      chats = [chat, ...chats.filter(c => c.id !== chat.id)];
      saveChats(); renderSidebar();
    }

    // ---------------- network turn ----------------
    function syncComposer() { send.disabled = !!current && pendingChats.has(current.id); }
    function composerBusy(b, chat = current) {
      if (b) pendingChats.add(chat.id); else pendingChats.delete(chat.id);
      syncComposer();
    }
    function addThinking() {
      const b = el("bubble"); b.innerHTML = `<span class="dots"><i></i><i></i><i></i></span>`;
      const row = turnRow("bot", b); clearHero(); log.appendChild(row); scrollDown();
      return row;
    }

    async function ask(message, file, chat = current) {
      if (!chat || !chats.includes(chat) || pendingChats.has(chat.id)) return;
      composerBusy(true, chat);
      const thinking = chat === current ? addThinking() : null;
      try {
        const res = await fetch("/api/message", {
          method:"POST", headers:apiHeaders(),
          body: JSON.stringify({ message, file, state: chat.state }),
        });
        const r = await res.json();
        if (!res.ok) throw new Error(r.text || `Request failed (${res.status})`);
        if (!chats.includes(chat)) return; // a deleted conversation stays deleted
        if (r.state) chat.state = r.state;
        if (chat === current) {
          appState = chat.state;
          renderResult(r);
        }
        pushMsg({ role:"bot", result:r }, chat);
      } catch (err) {
        const r = { kind:"error", text:err.message };
        if (chats.includes(chat)) {
          if (chat === current) renderResult(r);
          pushMsg({ role:"bot", result:r }, chat);
        }
      } finally {
        thinking?.remove();
        composerBusy(false, chat);
        if (chat === current) q.focus();
      }
    }

    // One live-timeline renderer, shared by both run paths (benchmark demo + uploaded new screen).
    // Renders register steps, the per-round proposal (source mix, SHAP, cross-experiment transfer note,
    // genes), the reveal + rising progress bar, and the final hit@R5 table. `finish` closes the stream.
    function makeRunHandler(tl, finish) {
      let roundEl = null;
      return (e) => {
        if (e.type === "upload") tl.appendChild(el("run-head", `📤 New screen <b>${esc(e.name)}</b> uploaded (${(e.bytes / 1024).toFixed(0)} KB) — registering it (no code change, just data)…`));
        else if (e.type === "anchors") tl.appendChild(el("run-head", `anchor genes: <span translate="no">${e.anchors.map(esc).join(", ")}</span>`));
        else if (e.type === "registering") tl.appendChild(el("run-head", `⚙ Building ML features for <b>${esc(e.name)}</b>…`));
        else if (e.type === "registered") tl.appendChild(el("run-head", `✅ Registered <b>${esc(e.name)}</b> — ${e.nGenes} genes (${e.nWithFeatures} with known features)${tierNote(e.tier, e.nCoreEssentialRemoved)}${designNote(e.design, e.depmap)}. Rankable now.`));
        else if (e.type === "already-registered") tl.appendChild(el("run-head", `<b>${esc(e.name)}</b> is already registered.`));
        else if (e.type === "intent") tl.appendChild(el("run-head", `🧠 ${esc(e.text)}<div class="rh-readout">reveal source: ${esc(e.readout)}</div>`));
        else if (e.type === "round-open") {
          roundEl = el("run-round", `<div class="rr-head"><span class="rr-spin"></span>Round ${e.round}/${e.rounds}</div><div class="rr-body">C-arm ranking the pool…</div>`);
          tl.appendChild(roundEl);
        } else if (e.type === "proposed" && roundEl) {
          const c = e.counts || {}, tf = e.transfer || {};
          const shap = Object.entries(e.shap || {}).sort((a, b) => b[1] - a[1]).slice(0, 4);
          const mx = shap.length ? shap[0][1] : 1;
          const shown = e.genes.slice(0, 16);
          const prior = tf.zeroShot
            ? `prior: trained on <b>${tf.refScreens}</b> reference screens · 0 in-experiment labels yet — zero-shot transfer`
            : `prior: ${tf.refScreens} reference screens · +${tf.inExpLabels} in-experiment labels revealed`;
          let html = `Proposed <b>${e.genes.length}</b> genes &nbsp;(w<sub>ML</sub> ${e.w_ml ?? "?"} · w<sub>LLM</sub> ${e.w_llm ?? "?"})`;
          if (tf.refScreens != null) html += `<div class="transfer-note">🔀 ${prior}</div>`;
          html += `<div class="src-chips"><span class="src-chip ml">ML ${c.ml_only ?? "?"}</span><span class="src-chip llm">LLM ${c.llm_only ?? "?"}</span><span class="src-chip both">both ${c.both ?? "?"}</span></div>`;
          html += shap.map(([k, v]) => `<div class="shap-row"><span class="sh-name">${esc(k)}</span><span class="sh-bar" style="width:${Math.max(6, Math.round(v / mx * 120))}px"></span><span>${v.toFixed(2)}</span></div>`).join("");
          html += `<div class="run-genes" translate="no">${shown.map(g => `<span class="g">${esc(g)}</span>`).join("")}${e.genes.length > 16 ? ` <span style="color:var(--faint)">+${e.genes.length - 16} more</span>` : ""}</div>`;
          roundEl.querySelector(".rr-body").innerHTML = html;
        } else if (e.type === "revealed" && roundEl) {
          const line = el("reveal-line");
          line.innerHTML = `<span class="rv-hits">+${e.nHits} hits</span><div class="progress"><i style="width:${(e.ratio * 100).toFixed(1)}%"></i></div><span>${e.cumulative}/${e.total} · hit@R${e.round} ${(e.ratio * 100).toFixed(1)}%</span>`;
          roundEl.querySelector(".rr-body").appendChild(line);
          roundEl.classList.add("done");
        } else if (e.type === "summary") {
          const rows = (e.perRound || []).map(r => `<tr><td>Round ${r.round}</td><td>+${r.nHits}</td><td>${r.cumulative}</td><td>${(r.ratio * 100).toFixed(1)}%</td></tr>`).join("");
          tl.appendChild(el("run-summary",
            `<div class="rs-num">hit@R${e.rounds} = ${(e.hit_at_r5 * 100).toFixed(1)}%</div>`
            + `<div class="rs-sub">${e.cumulative} of ${e.total} true hits found across ${e.rounds} rounds on ${esc(e.dataset)}</div>`
            + `<table><thead><tr><th>Round</th><th>new hits</th><th>cumulative</th><th>hit@R</th></tr></thead><tbody>${rows}</tbody></table>`));
        } else if (e.type === "done") { finish(); }
        else if (e.type === "error") { tl.appendChild(el("run-head", "⚠ " + esc(e.text))); finish(); }
        scrollDown();
      };
    }

    // Benchmark demo: a bundled screen's readout stands in as ground truth (EventSource / GET).
    function runDemo(dataset, rounds) {
      const chat = current;
      if (!chat || pendingChats.has(chat.id)) return;
      clearHero();
      const label = `Auto-run ${dataset} — retrospective evaluation (${rounds} rounds)`;
      addYou(label); setTitleFrom(label); pushMsg({ role:"you", text:label }, chat);
      const tl = el("run-timeline"); addBot(tl); composerBusy(true, chat);
      const es = new EventSource(`/api/run-stream?dataset=${encodeURIComponent(dataset)}&rounds=${rounds}&token=${encodeURIComponent(WEB_TOKEN)}`);
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true; es.close(); composerBusy(false, chat); if (chat === current) q.focus();
      };
      const h = makeRunHandler(tl, finish);
      es.onmessage = (ev) => { let e; try { e = JSON.parse(ev.data); } catch { return; } h(e); };
      es.onerror = () => { tl.appendChild(el("run-head", "⚠ connection closed")); finish(); };
    }

    // Real production path: register a brand-new screen from the scientist's uploaded readout, then run
    // it — streamed over POST (the file body won't fit in a GET) and read from the fetch response stream.
    const pct = (x) => `${(100 * (x || 0)).toFixed(1)}%`;
    // "12/802 (1.5%)" when the screen-wide hit count is known, else hits per tested gene
    function progressText(r) {
      if (r.total != null && r.ratio != null) return `${r.cumulative}/${r.total} (${pct(r.ratio)})`;
      return `${r.cumulative} hits in ${r.testedSoFar ?? "?"} tested genes (${pct(r.hitRate)} of tested; screen-wide total unknown)`;
    }

    // "· tier: non-essential (n core-essential genes removed)" for a registered phenotype, else ""
    function tierNote(tier, removed) {
      if (tier === "full_pool") return " · tier: full pool (core-essential genes kept)";
      if (tier === "non_essential") return ` · tier: non-essential (${Number(removed) || 0} core-essential genes removed)`;
      return "";
    }

    // " · CRISPRa in primary T cells → DepMap off" for a registered phenotype's design, else ""
    function designNote(m, depmap) {
      if (!m) return "";
      const where = m.cell_line ? ` in ${esc(m.cell_line)}` : "";
      const dm = { none: "off", pan: "pan-cancer only", pan_k562: "pan-cancer + K562" }[depmap] || esc(depmap || "?");
      return ` · ${esc(m.modality)}${m.modality === "unknown" ? " (treated as loss-of-function)" : ""}${where}`
        + `${m.curated_ess ? ", curated essential panel" : ""} → DepMap ${dm}`;
    }

    // KO / CRISPRi / CRISPRa from a typed answer (mirrors onboard.mjs parseModality); "" = unknown; null = unrecognised
    function modalityOf(text) {
      const t = String(text || "").trim();
      if (!t || /^(?:unknown|unsure|not sure|\?)$/i.test(t)) return "unknown";
      if (/crispr-?a\b|crispr[- ]activation|vp64|\bvpr\b|over-?express|gain[- ]of[- ]function/i.test(t)) return "CRISPRa";
      if (/crispr-?i\b|crispr[- ]interference|knock-?down|krab/i.test(t)) return "CRISPRi";
      if (/\bko\b|knock-?out|crispr-?ko|\bcas9\b/i.test(t)) return "KO";
      return null;
    }

    async function runUpload({ name, content, fileName, task, rounds, tier = "non_essential", modality, cellLine }, chat = current) {
      if (!chat || !chats.includes(chat) || pendingChats.has(chat.id)) return;
      const label = `📤 Upload & run "${name}" — register from my screen, then rank (${rounds} rounds)`;
      if (chat === current) {
        clearHero();
        addYou(label); setTitleFrom(label);
      }
      pushMsg({ role:"you", text:label }, chat);
      const tl = el("run-timeline");
      if (chat === current) addBot(tl);
      composerBusy(true, chat);
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true; composerBusy(false, chat); if (chat === current) q.focus();
      };
      const h = makeRunHandler(tl, finish);
      try {
        const res = await fetch("/api/run-upload", {
          method: "POST", headers: apiHeaders(),
          body: JSON.stringify({ name, readoutContent: content, readoutName: fileName, task, rounds, tier, modality, cellLine }),
        });
        if (!res.ok) throw new Error((await res.json()).text || `Request failed (${res.status})`);
        const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
        for (;;) {
          const { value, done } = await reader.read(); if (done) break;
          buf += dec.decode(value, { stream: true });
          let i;
          while ((i = buf.indexOf("\n\n")) >= 0) {
            const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
            const line = chunk.split("\n").find(l => l.startsWith("data:"));
            if (line) { let e; try { e = JSON.parse(line.slice(5).trim()); } catch { continue; } h(e); }
          }
        }
        finish();
      } catch (err) { tl.appendChild(el("run-head", "⚠ " + esc(err.message))); finish(); }
    }

    // "Upload & run my own screen" affordance: pick a readout, name it, one line on the phenotype, go.
    function startUploadRun() {
      const chat = current;
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".csv,.txt,.tsv";
      inp.onchange = () => {
        const f = inp.files && inp.files[0]; if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          if (!chats.includes(chat)) return;
          const base = (f.name.replace(/\.[^.]+$/, "").replace(/[^A-Za-z0-9_]/g, "_").slice(0, 40)) || "MyScreen";
          let name = prompt("Name this screen (letters / digits / underscore):", base);
          if (name == null) return;
          name = name.replace(/[^A-Za-z0-9_]/g, "_") || base;
          const task = prompt("One line — what phenotype does this screen measure?", "") || "";
          // The design sets which DepMap essentiality features the model may use (none for CRISPRa, pan-cancer only in K562).
          let modality = null;
          for (let ask = "Perturbation: KO, CRISPRi or CRISPRa? (blank = unknown, treated as loss-of-function)"; modality == null;
               ask = "Not recognised — type KO, CRISPRi or CRISPRa (blank = unknown):") {
            const said = prompt(ask, "");
            if (said == null) return;
            modality = modalityOf(said);
          }
          const cellLine = (prompt("Cell line / type (e.g. K562, primary T cells; blank = unknown):", "") || "").trim();
          const tier = confirm("Remove the 684 common core-essential genes (CEGv2) from the candidates?\n\n"
            + "OK = remove them (default; the paper's main tier: phenotype-specific hits)\n"
            + "Cancel = keep the full pool, essentials included") ? "non_essential" : "full_pool";
          runUpload({ name, content: String(reader.result), fileName: f.name, task, rounds: 5, tier, modality, cellLine }, chat);
        };
        reader.readAsText(f);
      };
      inp.click();
    }

    // send a typed/clicked message (optionally with the staged composer file)
    function sendTurn(message) {
      if (!current || pendingChats.has(current.id)) return;
      const text = (message || "").trim();
      const file = staged;
      if (!text && !file) return;
      const label = file
        ? (text ? `${text}\n📎 ${file.name}` : `📎 Attached ${file.name}`)
        : text;
      addYou(label);
      setTitleFrom(text || (file ? file.name : ""));
      pushMsg({ role:"you", text:label });
      clearStaged();
      ask(text, file);
    }

    // send a file chosen from an inline (contextual) file input
    function uploadFile(input) {
      const chat = current;
      if (!chat || pendingChats.has(chat.id)) return;
      const f = input.files && input.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        if (!chats.includes(chat) || pendingChats.has(chat.id)) return;
        const label = `📎 uploaded ${f.name} (${(f.size / 1024).toFixed(1)} KB)`;
        if (chat === current) addYou(label);
        pushMsg({ role:"you", text:label }, chat);
        ask("", { name:f.name, content:String(reader.result) }, chat);
      };
      reader.readAsText(f);
    }

    // ---------------- composer attach (persistent) ----------------
    function clearStaged() { staged = null; fileInput.value = ""; attachChip.classList.remove("show"); }
    attachBtn.onclick = () => fileInput.click();
    fileInput.onchange = () => {
      const chat = current;
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        if (chat !== current || !chats.includes(chat)) return;
        staged = { name:f.name, content:String(reader.result) };
        attachName.textContent = `${f.name} (${(f.size / 1024).toFixed(1)} KB)`;
        attachChip.classList.add("show");
        q.focus();
      };
      reader.readAsText(f);
    };
    attachRemove.onclick = clearStaged;

    // ---------------- composer input behaviour ----------------
    function autogrow() { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 200) + "px"; }
    q.addEventListener("input", autogrow);
    q.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (send.disabled) return;
      const text = q.value.trim();
      if (!text && !staged) return;
      q.value = ""; autogrow();
      sendTurn(text);
    });

    // ---------------- nav (mobile) ----------------
    function closeNav() { app.classList.remove("nav-open"); }
    document.getElementById("menuBtn").onclick = () => app.classList.toggle("nav-open");
    document.getElementById("scrim").onclick = closeNav;
    document.getElementById("newChat").onclick = newChat;

    // ---------------- boot ----------------
    loadChats();
    if (chats.length) selectChat(chats[0].id);
    else newChat();
  </script>
</body>
</html>
